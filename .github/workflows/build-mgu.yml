name: Build ID7 MGU Store Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Drag Config App
        run: |
          python3 kit/tools/build.py drag_control
      - name: Publish to GitHub Release for MGU Store
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: dist/*.tgz
